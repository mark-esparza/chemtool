# Render deployment blueprint.
#
# Deploy: on https://dashboard.render.com click "New +" -> "Blueprint",
# connect this repo, and Render reads this file. No secrets/API keys are
# required — the app runs fully on-device (PubChem is fetched live over the
# public network, which Render allows by default).
services:
  - type: web
    name: chemtool
    runtime: node
    plan: free
    # --include=dev forces devDependencies (vite/esbuild/tsx/typescript) to be
    # installed even though NODE_ENV=production, so the build can run.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Serve the prebuilt client from dist/ instead of booting Vite in dev mode.
      - key: NODE_ENV
        value: production
